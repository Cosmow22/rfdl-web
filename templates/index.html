<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Téléchargeur de podcasts RadioFrance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.8"></script>
     <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main>
        <div class="container">
            <h1>RadioFrance <span>Téléchargeur</span></h1>
            <p>Collez l'URL du podcast RadioFrance et téléchargez-le </br> en un clic.</p>
            <form 
                hx-post="/"
                hx-target="#popup-container"
                hx-swap="innerHTML">
                <input type="text" name="input-link" id="input-link" placeholder="https://www.radiofrance.fr/..." autofocus>
                <button type="submit">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/></svg>
                    Télécharger
                </button>
            </form>
            <!-- <p id="error-message"></p> -->
            <div id="popup-container"></div>
            <ul>
                <li>Rapide</li>
                <li>Gratuit</li>
                <li>Qualité standard</li>
                <li>Sans inscription</li>
            </ul>
        </div>
    </main>
    <footer>Ce site vous a été utile ? Mettez une étoile au projet <a href="https://github.com/Cosmow22/radio-france-dl">gihtub</a> ! ⭐</footer>
</body>
<script>
function closePopup() {
    document.getElementById("popup-overlay").remove();
}
</script>
</html>
